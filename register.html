<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Safe Space</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#6C4FD1" />
  <link rel="icon" type="image/png" href="assets/icons/favicon.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
</head>
<body class="auth-page">
  <!-- Page Loading Overlay -->
  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <div class="loader-spinner-ring">
        <div class="loader-icon-center">
          <img class="loader-logo-img" src="assets/icons/SAFE_SPACE_LOGO.png" alt="Safe Space" />
        </div>
      </div>
      <div class="loader-label">Safe Space</div>
      <div class="loader-sublabel">Loading...</div>
    </div>
  </div>

  <!-- Back to Welcome -->
  <a href="welcome.html" style="position:fixed;top:16px;left:16px;z-index:10;color:rgba(255,255,255,0.85);font-size:22px;text-decoration:none;" aria-label="Back">
    <i class="fas fa-chevron-left"></i>
  </a>
  <div class="auth-container">

    <!-- Title -->
    <h1 class="auth-title">SIGN UP</h1>
    <p class="auth-subtitle">FOR YOUR ACCOUNT</p>

    <!-- Avatar Upload -->
    <div class="avatar-upload" id="avatarUpload">
      <div class="avatar-circle" id="avatarCircle">
        <i class="fas fa-user" id="avatarIcon"></i>
        <img id="avatarPreview" src="" alt="Avatar preview"
             style="display:none; width:100%; height:100%; object-fit:cover; border-radius:50%;" />
      </div>
      <div class="camera-badge" id="cameraBadge">
        <i class="fas fa-camera"></i>
      </div>
      <input type="file" id="avatarFile" accept="image/*" style="display:none;" />
    </div>
    <p style="text-align:center; color:rgba(255,255,255,0.75); font-size:0.78rem; margin: 4px 0 18px;">
      Add a profile photo (optional)
    </p>

    <!-- Form -->
    <form class="auth-form" id="registerForm" novalidate>

      <!-- First Name -->
      <div class="input-group">
        <span class="input-icon"><i class="fas fa-id-card"></i></span>
        <input class="auth-input" type="text" id="firstName" placeholder="First name" autocomplete="given-name" required />
      </div>

      <!-- Last Name -->
      <div class="input-group">
        <span class="input-icon"><i class="fas fa-id-card"></i></span>
        <input class="auth-input" type="text" id="lastName" placeholder="Last name" autocomplete="family-name" required />
      </div>

      <!-- Middle Name -->
      <div class="input-group">
        <span class="input-icon"><i class="fas fa-id-card"></i></span>
        <input class="auth-input" type="text" id="middleName" placeholder="Middle name (optional)" autocomplete="additional-name" />
      </div>

      <!-- Age -->
      <div class="input-group">
        <span class="input-icon"><i class="fas fa-birthday-cake"></i></span>
        <input class="auth-input" type="number" id="age" placeholder="Age" min="1" max="120" required />
      </div>

      <!-- Sex -->
      <div class="input-group">
        <span class="input-icon"><i class="fas fa-venus-mars"></i></span>
        <select class="auth-input" id="sex" required
          style="appearance:none; -webkit-appearance:none; cursor:pointer;">
          <option value="" disabled selected>Sex</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Non-binary">Non-binary</option>
          <option value="Prefer not to say">Prefer not to say</option>
        </select>
      </div>

      <!-- Birthday -->
      <div class="input-group">
        <span class="input-icon"><i class="fas fa-calendar"></i></span>
        <input class="auth-input" type="date" id="birthday" required
          style="color-scheme: dark;" />
      </div>

      <!-- Username -->
      <div class="input-group">
        <span class="input-icon"><i class="fas fa-user"></i></span>
        <input class="auth-input" type="text" id="username" placeholder="Username" autocomplete="username" required />
      </div>

      <!-- Email -->
      <div class="input-group">
        <span class="input-icon"><i class="fas fa-envelope"></i></span>
        <input class="auth-input" type="email" id="email" placeholder="Email address" autocomplete="email" required />
      </div>

      <!-- Password -->
      <div class="input-group">
        <span class="input-icon"><i class="fas fa-lock"></i></span>
        <input class="auth-input" type="password" id="password" placeholder="Password (min 8 chars)"
               autocomplete="new-password" required minlength="8" />
        <button type="button" class="input-icon-right" id="eyeToggle1" aria-label="Toggle password" tabindex="-1">
          <i class="fas fa-eye" id="eyeIcon1"></i>
        </button>
      </div>

      <!-- Confirm Password -->
      <div class="input-group">
        <span class="input-icon"><i class="fas fa-lock"></i></span>
        <input class="auth-input" type="password" id="confirmPassword" placeholder="Confirm password"
               autocomplete="new-password" required />
        <button type="button" class="input-icon-right" id="eyeToggle2" aria-label="Toggle confirm password" tabindex="-1">
          <i class="fas fa-eye" id="eyeIcon2"></i>
        </button>
      </div>

      <!-- Password hint -->
      <div class="input-hint">
        <i class="fas fa-info-circle"></i>
        Password must be at least 8 characters.
      </div>

      <!-- Error message area -->
      <p id="formError" style="color:#ffcccc; font-size:0.82rem; text-align:center; margin:4px 0; min-height:20px;"></p>

      <!-- Submit -->
      <button type="submit" class="btn-auth-primary" id="signupBtn">
        <span id="signupBtnText">SIGN UP</span>
        <span id="signupBtnSpinner" style="display:none;">
          <i class="fas fa-circle-notch fa-spin"></i> Creating account…
        </span>
      </button>

    </form>

    <!-- Sign in link -->
    <div class="auth-link-row">
      Already have an account? <a href="login.html">Sign in</a>
    </div>

    <!-- Wave -->
    <div class="auth-wave"></div>
  </div>

  <script src="js/lib/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
  <script>
    /* Hide page loader once register page is ready */
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() { if (typeof hidePageLoader === 'function') hidePageLoader(); }, 200);
    });

    /* ────────────────────────────────
       Avatar Upload
    ──────────────────────────────── */
    var avatarCircle  = document.getElementById('avatarCircle');
    var cameraBadge   = document.getElementById('cameraBadge');
    var avatarFile    = document.getElementById('avatarFile');
    var avatarPreview = document.getElementById('avatarPreview');
    var avatarIcon    = document.getElementById('avatarIcon');
    var avatarDataURL   = null;

    function triggerAvatarPicker() { avatarFile.click(); }
    avatarCircle.addEventListener('click', triggerAvatarPicker);
    cameraBadge.addEventListener('click', triggerAvatarPicker);

    avatarFile.addEventListener('change', function() {
      var file = avatarFile.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        avatarDataURL = e.target.result;
        avatarPreview.src = avatarDataURL;
        avatarPreview.style.display = 'block';
        avatarIcon.style.display    = 'none';
      };
      reader.readAsDataURL(file);
    });

    /* ────────────────────────────────
       Eye Toggles
    ──────────────────────────────── */
    function setupEye(inputId, toggleId, iconId) {
      var input  = document.getElementById(inputId);
      var toggle = document.getElementById(toggleId);
      var icon   = document.getElementById(iconId);
      toggle.addEventListener('click', function() {
        var hidden = input.type === 'password';
        input.type   = hidden ? 'text'    : 'password';
        icon.className = hidden ? 'fas fa-eye-slash' : 'fas fa-eye';
      });
    }
    setupEye('password',        'eyeToggle1', 'eyeIcon1');
    setupEye('confirmPassword', 'eyeToggle2', 'eyeIcon2');

    /* ────────────────────────────────
       Form Helpers
    ──────────────────────────────── */
    function showError(msg) {
      document.getElementById('formError').textContent = msg;
    }

    function setLoading(loading) {
      var btn     = document.getElementById('signupBtn');
      var text    = document.getElementById('signupBtnText');
      var spinner = document.getElementById('signupBtnSpinner');
      btn.disabled        = loading;
      text.style.display    = loading ? 'none'        : '';
      spinner.style.display = loading ? 'inline-flex' : 'none';
    }

    function val(id) {
      return document.getElementById(id).value.trim();
    }

    /* ────────────────────────────────
       Form Submit
    ──────────────────────────────── */
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      showError('');

      var firstName      = val('firstName');
      var lastName       = val('lastName');
      var middleName     = val('middleName');
      var age            = val('age');
      var sex            = val('sex');
      var birthday       = val('birthday');
      var username       = val('username');
      var email          = val('email');
      var password       = document.getElementById('password').value;
      var confirmPwd     = document.getElementById('confirmPassword').value;

      /* ── Validation ── */
      if (!firstName || !lastName || !age || !sex || !birthday || !username || !email || !password || !confirmPwd) {
        showError('Please fill in all required fields.');
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showError('Please enter a valid email address.');
        return;
      }
      if (password.length < 8) {
        showError('Password must be at least 8 characters.');
        return;
      }
      if (password !== confirmPwd) {
        showError('Passwords do not match.');
        return;
      }
      if (parseInt(age, 10) < 1 || parseInt(age, 10) > 120) {
        showError('Please enter a valid age.');
        return;
      }

      setLoading(true);

      try {
        if (typeof SafeSpaceDB === 'undefined' || !SafeSpaceDB.auth) {
          throw new Error('Database client initializing... please try again in a second.');
        }

        var payload = {
          email:       email,
          password:    password,
          username:    username,
          first_name:  firstName,
          last_name:   lastName,
          middle_name: middleName || null,
          age:         parseInt(age, 10),
          sex:         sex,
          birthday:    birthday,
          avatar_url:  avatarDataURL || null
        };

        var result = await SafeSpaceDB.auth.signUp(payload);
        if (result && result.error) throw result.error;

        // If a real confirmation email was sent via SMTP
        if (result && result.needsEmailConfirmation) {
          var container = document.querySelector('.auth-container');
          if (container) {
            container.innerHTML = `
              <div style="width:72px; height:72px; background:rgba(255,255,255,0.22); border-radius:50%; display:flex; align-items:center; justify-content:center; margin: 30px auto 20px; font-size:32px; color:#fff; box-shadow:0 8px 24px rgba(0,0,0,0.15);">
                <i class="fas fa-envelope-circle-check"></i>
              </div>
              <h1 class="auth-title" style="font-size:24px;">CONFIRM EMAIL</h1>
              <p class="auth-subtitle">CHECK YOUR INBOX</p>
              <div style="background:rgba(255,255,255,0.15); border-radius:18px; padding:20px; margin:20px 0; text-align:center; border:1px solid rgba(255,255,255,0.25);">
                <p style="color:#fff; font-size:14px; line-height:1.6; margin-bottom:12px;">
                  We have sent a confirmation link to:
                </p>
                <div style="background:rgba(0,0,0,0.2); border-radius:30px; padding:8px 16px; display:inline-block; color:#fff; font-weight:700; font-size:13px; word-break:break-all;">
                  ${escapeHTML(email)}
                </div>
                <p style="color:rgba(255,255,255,0.8); font-size:12px; line-height:1.5; margin-top:14px;">
                  Please check your inbox (or spam folder) and click the link to activate your student account.
                </p>
              </div>
              <a href="login.html" class="btn-auth-primary" style="display:flex; align-items:center; justify-content:center; text-decoration:none; height:48px; font-weight:700; gap:8px;">
                <i class="fas fa-right-to-bracket"></i> GO TO LOGIN
              </a>
              <div class="auth-wave"></div>
            `;
          }
          return;
        }

        window.location.href = 'home.html';
      } catch (err) {
        var msg = (err && err.message) ? err.message : 'Registration failed. Please try again.';
        showError(msg);
        if (typeof showToast === 'function') showToast(msg, 'error');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
