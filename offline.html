<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Safe Space - You're Offline</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .offline-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 100vh;
            padding: 30px;
            background: linear-gradient(180deg, #FEEAFA 0%, #FFFFFF 100%);
        }
        .offline-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #EDE8FD;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.15);
        }
        .offline-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 12px;
        }
        .offline-desc {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 300px;
            margin-bottom: 28px;
        }
    </style>
</head>
<body>
    <div class="offline-wrapper">
        <div class="offline-icon">
            <i class="fas fa-wifi-slash"></i>
        </div>
        <h1 class="offline-title">You're Offline</h1>
        <p class="offline-desc">
            Safe Space cannot connect to the internet right now. Please check your Wi-Fi or data connection to reconnect to the community.
        </p>
        <button class="btn btn-primary" onclick="window.location.reload();" style="max-width: 240px;">
            <i class="fas fa-rotate-right"></i> Try Again
        </button>
    </div>
</body>
</html>
