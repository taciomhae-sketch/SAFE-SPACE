<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Safe Space</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#6C4FD1" />
  <link rel="icon" type="image/png" href="assets/icons/favicon.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
</head>
<body class="auth-page">
  <!-- Page Loading Overlay -->
  <div class="page-loader" id="pageLoader">
    <div class="loader-content">
      <div class="loader-spinner-ring">
        <div class="loader-icon-center">
          <img class="loader-logo-img" src="assets/icons/SAFE_SPACE_LOGO.png" alt="Safe Space" />
        </div>
      </div>
      <div class="loader-label">Safe Space</div>
      <div class="loader-sublabel">Loading...</div>
    </div>
  </div>

  <!-- Back to Welcome -->
  <a href="welcome.html" style="position:fixed;top:16px;left:16px;z-index:10;color:rgba(255,255,255,0.85);font-size:22px;text-decoration:none;" aria-label="Back">
    <i class="fas fa-chevron-left"></i>
  </a>
  <div class="auth-container">

    <!-- App Icon -->
    <div class="auth-icon">
      <i class="fas fa-hand-holding-heart"></i>
    </div>

    <!-- Title -->
    <h1 class="auth-title">LOGIN</h1>
    <p class="auth-subtitle">TO CONTINUE</p>
    <p class="auth-welcome">Welcome to Safe Space App</p>

    <!-- Already Signed In Notice Card (Shown if an active session exists) -->
    <div id="alreadySignedInCard" class="already-signed-in-card hidden" style="display:none;">
      <div class="already-signed-in-badge">
        <i class="fas fa-check-circle"></i> Active Session
      </div>
      <div class="already-signed-in-user" id="signedInUserName">Signed In User</div>
      <div class="already-signed-in-email" id="signedInUserEmail">user@safespace.org</div>
      <p style="color:rgba(255,255,255,0.85); font-size:12px; margin-bottom:14px;">
        This account is already signed in on this device.
      </p>
      <div class="already-signed-in-actions">
        <a href="home.html" class="btn-signed-in-continue" id="continueSessionBtn">
          <i class="fas fa-arrow-right"></i> Continue to Safe Space
        </a>
        <button type="button" class="btn-signed-in-switch" id="switchAccountBtn">
          <i class="fas fa-right-from-bracket"></i> Sign Out / Switch Account
        </button>
      </div>
    </div>

    <!-- Auth In-Form Alert Box -->
    <div id="loginAlert" class="auth-alert hidden" role="alert">
      <i class="alert-icon fas fa-circle-exclamation" id="loginAlertIcon"></i>
      <div class="alert-content">
        <span class="alert-message" id="loginAlertMessage"></span>
        <div id="loginAlertAction" style="margin-top:6px;"></div>
      </div>
    </div>

    <!-- Main Login Form -->
    <form class="auth-form" id="loginForm" novalidate>

      <!-- Email -->
      <div class="input-group">
        <span class="input-icon"><i class="fas fa-envelope"></i></span>
        <input
          class="auth-input"
          type="email"
          id="emailInput"
          placeholder="someone@gmail.com"
          autocomplete="email"
          required
        />
      </div>

      <!-- Password -->
      <div class="input-group">
        <span class="input-icon"><i class="fas fa-lock"></i></span>
        <input
          class="auth-input"
          type="password"
          id="passwordInput"
          placeholder="Password"
          autocomplete="current-password"
          required
        />
        <button
          type="button"
          class="input-icon-right"
          id="eyeToggle"
          aria-label="Toggle password visibility"
          tabindex="-1"
        >
          <i class="fas fa-eye" id="eyeIcon"></i>
        </button>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-auth-primary" id="loginBtn">
        <span id="loginBtnText">LOGIN</span>
        <span id="loginBtnSpinner" style="display:none;">
          <i class="fas fa-circle-notch fa-spin"></i> Signing in…
        </span>
      </button>

    </form>

    <!-- OTP Modal/Card (if user needs to verify email with Supabase OTP) -->
    <div id="loginOtpCard" class="otp-card hidden" style="display:none; width:100%; margin-top:10px;">
      <div class="otp-header-icon">
        <i class="fas fa-shield-halved"></i>
      </div>
      <h2 style="color:#fff; font-size:20px; font-weight:800; text-align:center; margin-bottom:4px;">VERIFY OTP</h2>
      <p style="color:rgba(255,255,255,0.75); font-size:12px; text-transform:uppercase; letter-spacing:1.5px; text-align:center;">ENTER 6-DIGIT CODE</p>
      
      <div class="otp-email-badge">
        <i class="fas fa-envelope"></i>
        <span id="otpTargetEmail">user@gmail.com</span>
      </div>

      <div class="otp-inputs-row" id="loginOtpInputsRow">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" data-idx="0" />
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" data-idx="1" />
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" data-idx="2" />
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" data-idx="3" />
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" data-idx="4" />
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit" data-idx="5" />
      </div>

      <button type="button" class="btn-auth-primary" id="verifyOtpBtn">
        <span id="verifyOtpBtnText">VERIFY & SIGN IN</span>
        <span id="verifyOtpBtnSpinner" style="display:none;">
          <i class="fas fa-circle-notch fa-spin"></i> Verifying…
        </span>
      </button>

      <div class="otp-resend-row">
        <span>Didn't get code?</span>
        <button type="button" class="btn-otp-resend" id="resendOtpBtn">Resend Code</button>
      </div>

      <div class="otp-back-row">
        <button type="button" class="btn-otp-back" id="closeOtpBtn">
          <i class="fas fa-arrow-left"></i> Back to Password Login
        </button>
      </div>
    </div>

    <!-- Register link -->
    <div class="auth-link-row" id="registerLinkRow">
      New here? <a href="register.html">Create an account</a>
    </div>


    <!-- Wave -->
    <div class="auth-wave"></div>
  </div>

  <script src="js/lib/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
  <script>
    var currentActiveUser = null;
    var otpPendingEmail = '';
    var resendCooldownTimer = null;

    document.addEventListener('DOMContentLoaded', async function() {
      setTimeout(function() {
        if (typeof hidePageLoader === 'function') hidePageLoader();
      }, 200);

      // Check if user is already signed in
      await checkExistingSession();

      // Check URL params (e.g. ?verify=email or ?message=...)
      checkUrlParams();
    });

    /* ── Check if already signed in ── */
    async function checkExistingSession() {
      try {
        if (typeof SafeSpaceDB !== 'undefined' && SafeSpaceDB.auth) {
          var user = await SafeSpaceDB.auth.getCurrentUser();
          if (user && user.email) {
            currentActiveUser = user;
            var name = SafeSpaceDB._displayName ? SafeSpaceDB._displayName(user) : (user.username || user.email);
            document.getElementById('signedInUserName').textContent = name;
            document.getElementById('signedInUserEmail').textContent = user.email;
            
            var card = document.getElementById('alreadySignedInCard');
            card.style.display = 'block';
            card.classList.remove('hidden');

            showFormAlert('You are already signed in as ' + name + ' (' + user.email + '). You can continue or switch account.', 'info');
          }
        }
      } catch (e) {
        console.warn('Session check error:', e);
      }
    }

    /* ── Switch / Sign out button ── */
    document.getElementById('switchAccountBtn').addEventListener('click', async function() {
      if (typeof SafeSpaceDB !== 'undefined' && SafeSpaceDB.auth) {
        await SafeSpaceDB.auth.signOut();
      }
      currentActiveUser = null;
      var card = document.getElementById('alreadySignedInCard');
      card.style.display = 'none';
      card.classList.add('hidden');
      clearFormAlert();
      if (typeof showToast === 'function') {
        showToast('Signed out successfully. You can sign in with another account.', 'info');
      }
    });

    /* ── Eye toggle ── */
    var passwordInput = document.getElementById('passwordInput');
    var emailInput    = document.getElementById('emailInput');
    var eyeToggle     = document.getElementById('eyeToggle');
    var eyeIcon       = document.getElementById('eyeIcon');

    eyeToggle.addEventListener('click', function() {
      var isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      eyeIcon.className  = isHidden ? 'fas fa-eye-slash' : 'fas fa-eye';
    });

    // Clear error highlight on input
    [emailInput, passwordInput].forEach(function(el) {
      el.addEventListener('input', function() {
        el.classList.remove('has-error');
        if (document.getElementById('loginAlert').classList.contains('auth-alert-error')) {
          clearFormAlert();
        }
      });
    });

    /* ── Alert Helpers ── */
    function showFormAlert(message, type, actionHtml) {
      type = type || 'error';
      var alertBox = document.getElementById('loginAlert');
      var alertIcon = document.getElementById('loginAlertIcon');
      var alertMsg = document.getElementById('loginAlertMessage');
      var alertAction = document.getElementById('loginAlertAction');

      alertBox.className = 'auth-alert auth-alert-' + type;
      alertMsg.textContent = message;

      if (type === 'error') alertIcon.className = 'alert-icon fas fa-circle-exclamation';
      else if (type === 'warning') alertIcon.className = 'alert-icon fas fa-triangle-exclamation';
      else if (type === 'success') alertIcon.className = 'alert-icon fas fa-circle-check';
      else alertIcon.className = 'alert-icon fas fa-circle-info';

      if (actionHtml) {
        alertAction.innerHTML = actionHtml;
        alertAction.style.display = 'block';
      } else {
        alertAction.innerHTML = '';
        alertAction.style.display = 'none';
      }

      alertBox.classList.remove('hidden');
    }

    function clearFormAlert() {
      var alertBox = document.getElementById('loginAlert');
      alertBox.classList.add('hidden');
      alertBox.className = 'auth-alert hidden';
    }

    function setLoading(loading) {
      var btn     = document.getElementById('loginBtn');
      var text    = document.getElementById('loginBtnText');
      var spinner = document.getElementById('loginBtnSpinner');
      btn.disabled          = loading;
      text.style.display    = loading ? 'none'        : '';
      spinner.style.display = loading ? 'inline-flex' : 'none';
    }

    /* ── Login Logic ── */
    async function doLogin(email, password) {
      clearFormAlert();
      emailInput.classList.remove('has-error');
      passwordInput.classList.remove('has-error');

      // Check if user is already signed in with this exact email
      if (currentActiveUser && currentActiveUser.email && currentActiveUser.email.toLowerCase() === email.toLowerCase()) {
        showFormAlert('This account is already signed in! Redirecting to feed...', 'success');
        setTimeout(function() {
          if (typeof showPageLoader === 'function') showPageLoader('Opening feed...');
          window.location.href = 'home.html';
        }, 500);
        return;
      }

      setLoading(true);
      try {
        if (typeof SafeSpaceDB === 'undefined' || !SafeSpaceDB.auth) {
          throw new Error('Database client initializing... please try again.');
        }

        var result = await SafeSpaceDB.auth.signIn(email, password);
        if (result && result.error) throw result.error;

        var loggedUser = await SafeSpaceDB.auth.getCurrentUser();
        if (loggedUser && (loggedUser.is_deactivated === true || loggedUser.is_deactivated === 'true')) {
          setLoading(false);
          showFormAlert(
            'Your account is currently deactivated.',
            'warning',
            `<button type="button" class="auth-alert-action-btn" onclick="handleReactivateAccount()"><i class="fas fa-rotate-left"></i> Reactivate Account</button>`
          );
          return;
        }

        if (typeof showToast === 'function') {
          showToast('Welcome back! Signing you in...', 'success');
        }
        if (typeof showPageLoader === 'function') showPageLoader('Welcome back! Opening Safe Space...');
        window.location.href = 'home.html';
      } catch (err) {
        var friendlyMsg = (typeof SafeSpaceDB !== 'undefined' && SafeSpaceDB.auth && SafeSpaceDB.auth.formatAuthError)
          ? SafeSpaceDB.auth.formatAuthError(err)
          : (err.message || 'Login failed. Please try again.');

        var rawMsg = (err && err.message) ? err.message.toLowerCase() : '';

        // If email not confirmed, provide instant OTP verification button
        if (rawMsg.includes('email not confirmed') || rawMsg.includes('email_not_confirmed')) {
          showFormAlert(
            'Your account email is not verified yet. Please enter the OTP code sent to your email.',
            'warning',
            `<button type="button" class="auth-alert-action-btn" onclick="openOtpView('${escapeHTML(email)}')"><i class="fas fa-key"></i> Enter OTP Code</button>`
          );
        } else if (rawMsg.includes('invalid') || friendlyMsg.toLowerCase().includes('wrong password')) {
          passwordInput.classList.add('has-error');
          emailInput.classList.add('has-error');
          showFormAlert(friendlyMsg, 'error');
        } else {
          showFormAlert(friendlyMsg, 'error');
        }

        if (typeof showToast === 'function') {
          showToast(friendlyMsg, 'error');
        }
        setLoading(false);
      }
    }

    /* ── Form submit ── */
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var email    = emailInput.value.trim();
      var password = passwordInput.value;

      if (!email && !password) {
        emailInput.classList.add('has-error');
        passwordInput.classList.add('has-error');
        showFormAlert('Please enter your email and password.', 'error');
        return;
      }
      if (!email) {
        emailInput.classList.add('has-error');
        showFormAlert('Please enter your email address.', 'error');
        return;
      }
      if (!password) {
        passwordInput.classList.add('has-error');
        showFormAlert('Please enter your password.', 'error');
        return;
      }

      await doLogin(email, password);
    });

    /* ────────────────────────────────
       OTP Verification Workflow on Login
    ──────────────────────────────── */
    function openOtpView(email) {
      otpPendingEmail = email || emailInput.value.trim();
      document.getElementById('otpTargetEmail').textContent = otpPendingEmail;
      
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registerLinkRow').style.display = 'none';
      document.getElementById('loginOtpCard').style.display = 'flex';
      document.getElementById('loginOtpCard').classList.remove('hidden');

      clearFormAlert();
      showFormAlert('Enter the 6-digit verification code sent to ' + otpPendingEmail, 'info');

      // Focus first OTP digit
      var firstInput = document.querySelector('#loginOtpInputsRow .otp-digit');
      if (firstInput) {
        firstInput.value = '';
        firstInput.focus();
      }
    }

    window.openOtpView = openOtpView;

    document.getElementById('closeOtpBtn').addEventListener('click', function() {
      document.getElementById('loginOtpCard').style.display = 'none';
      document.getElementById('loginOtpCard').classList.add('hidden');
      document.getElementById('loginForm').style.display = 'flex';
      document.getElementById('registerLinkRow').style.display = 'block';
      clearFormAlert();
    });

    // Setup 6-digit OTP boxes logic
    var otpInputs = document.querySelectorAll('#loginOtpInputsRow .otp-digit');
    otpInputs.forEach(function(input, idx) {
      input.addEventListener('input', function(e) {
        var val = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = val ? val.charAt(val.length - 1) : '';
        if (e.target.value) {
          e.target.classList.add('filled');
          if (idx < otpInputs.length - 1) otpInputs[idx + 1].focus();
        } else {
          e.target.classList.remove('filled');
        }
      });

      input.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' && !e.target.value && idx > 0) {
          otpInputs[idx - 1].focus();
          otpInputs[idx - 1].value = '';
          otpInputs[idx - 1].classList.remove('filled');
        }
      });

      input.addEventListener('paste', function(e) {
        e.preventDefault();
        var pasteData = (e.clipboardData || window.clipboardData).getData('text').trim();
        var digits = pasteData.replace(/[^0-9]/g, '').slice(0, 6);
        for (var i = 0; i < digits.length; i++) {
          if (otpInputs[i]) {
            otpInputs[i].value = digits[i];
            otpInputs[i].classList.add('filled');
          }
        }
        var nextIdx = Math.min(digits.length, 5);
        if (otpInputs[nextIdx]) otpInputs[nextIdx].focus();
      });
    });

    // Verify OTP Button
    document.getElementById('verifyOtpBtn').addEventListener('click', async function() {
      var code = '';
      otpInputs.forEach(function(inp) { code += inp.value.trim(); });

      if (code.length < 6) {
        showFormAlert('Please enter the complete 6-digit verification code.', 'error');
        return;
      }

      var btn = document.getElementById('verifyOtpBtn');
      var text = document.getElementById('verifyOtpBtnText');
      var spinner = document.getElementById('verifyOtpBtnSpinner');
      btn.disabled = true;
      text.style.display = 'none';
      spinner.style.display = 'inline-flex';

      try {
        if (typeof SafeSpaceDB === 'undefined' || !SafeSpaceDB.auth) {
          throw new Error('Database client not ready. Please try again.');
        }

        var res = await SafeSpaceDB.auth.verifyOtp(otpPendingEmail, code, 'signup');
        if (res && res.error) throw res.error;

        showFormAlert('Email verified successfully! Signing you in...', 'success');
        if (typeof showToast === 'function') {
          showToast('Email verified successfully!', 'success');
        }
        setTimeout(function() {
          if (typeof showPageLoader === 'function') showPageLoader('Email verified! Opening Safe Space...');
          window.location.href = 'home.html';
        }, 500);
      } catch (err) {
        var msg = (typeof SafeSpaceDB !== 'undefined' && SafeSpaceDB.auth && SafeSpaceDB.auth.formatAuthError)
          ? SafeSpaceDB.auth.formatAuthError(err)
          : (err.message || 'OTP verification failed.');
        showFormAlert(msg, 'error');
        if (typeof showToast === 'function') showToast(msg, 'error');
        btn.disabled = false;
        text.style.display = '';
        spinner.style.display = 'none';
      }
    });

    // Resend OTP Button with countdown
    document.getElementById('resendOtpBtn').addEventListener('click', async function() {
      var btn = document.getElementById('resendOtpBtn');
      if (btn.disabled) return;

      try {
        btn.disabled = true;
        btn.textContent = 'Sending...';

        await SafeSpaceDB.auth.resendOtp(otpPendingEmail, 'signup');
        showFormAlert('A new verification code was sent to ' + otpPendingEmail, 'success');
        if (typeof showToast === 'function') showToast('Verification code resent!', 'success');

        var countdown = 60;
        btn.textContent = 'Resend in ' + countdown + 's';
        if (resendCooldownTimer) clearInterval(resendCooldownTimer);
        resendCooldownTimer = setInterval(function() {
          countdown--;
          if (countdown <= 0) {
            clearInterval(resendCooldownTimer);
            btn.disabled = false;
            btn.textContent = 'Resend Code';
          } else {
            btn.textContent = 'Resend in ' + countdown + 's';
          }
        }, 1000);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Resend Code';
        var msg = (typeof SafeSpaceDB !== 'undefined' && SafeSpaceDB.auth && SafeSpaceDB.auth.formatAuthError)
          ? SafeSpaceDB.auth.formatAuthError(err)
          : (err.message || 'Failed to resend code.');
        showFormAlert(msg, 'error');
      }
    });

    // Check URL parameters for direct verification mode
    function checkUrlParams() {
      var params = new URLSearchParams(window.location.search);
      var verifyEmail = params.get('verify') || params.get('email');
      var reason = params.get('reason');
      var message = params.get('message');

      if (message === 'deactivated') {
        showFormAlert('Your account has been deactivated.', 'info');
      } else if (message === 'deleted') {
        showFormAlert('Your account has been permanently deleted.', 'info');
      }

      if (verifyEmail && params.get('step') === 'otp') {
        emailInput.value = verifyEmail;
        openOtpView(verifyEmail);
      } else if (reason === 'unverified' && verifyEmail) {
        emailInput.value = verifyEmail;
        showFormAlert(
          'Your account is not verified yet. Please enter your OTP code.',
          'warning',
          `<button type="button" class="auth-alert-action-btn" onclick="openOtpView('${escapeHTML(verifyEmail)}')"><i class="fas fa-key"></i> Enter OTP Code</button>`
        );
      }
    }

    window.handleReactivateAccount = async function() {
      try {
        setLoading(true);
        await SafeSpaceDB.auth.updateProfile({ is_deactivated: false });
        if (typeof showToast === 'function') showToast('Account reactivated! Welcome back 💜', 'success');
        if (typeof showPageLoader === 'function') showPageLoader('Opening Safe Space...');
        window.location.href = 'home.html';
      } catch (err) {
        setLoading(false);
        showFormAlert('Failed to reactivate account: ' + (err.message || 'Please try again.'), 'error');
      }
    };
  </script>
</body>
</html>
