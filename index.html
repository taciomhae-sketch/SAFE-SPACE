<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Home — Safe Space</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#6C4FD1" />
</head>
<body>
  <div class="app-frame">
    <!-- Page Header -->
    <header class="page-header">
      <h1>Home</h1>
      <div class="header-actions">
        <button class="header-select-btn" id="selectBtn">Select</button>
        <button class="header-btn" id="notificationsBtn" aria-label="Notifications">
          <i class="fa-regular fa-bell"></i>
        </button>
      </div>
    </header>

    <!-- Category Pill Row -->
    <div class="pill-scroll-wrap">
      <div class="pill-row" id="categoryPillRow">
        <button class="pill active" data-category="all">All</button>
        <button class="pill" data-category="general">General</button>
        <button class="pill" data-category="support">Support</button>
        <button class="pill" data-category="stories">Stories</button>
      </div>
    </div>

    <!-- Scrollable Feed Content -->
    <main class="page-content" id="pageContent">
      <div class="feed-list" id="feedContainer">
        <!-- Skeleton Loading -->
        <div class="skeleton-post">
          <div class="sk-header">
            <div class="skeleton sk-avatar"></div>
            <div class="sk-lines">
              <div class="skeleton sk-line" style="width: 40%;"></div>
              <div class="skeleton sk-line short"></div>
            </div>
          </div>
          <div class="skeleton sk-line" style="margin-bottom: 8px;"></div>
          <div class="skeleton sk-line" style="width: 80%;"></div>
        </div>
        <div class="skeleton-post">
          <div class="sk-header">
            <div class="skeleton sk-avatar"></div>
            <div class="sk-lines">
              <div class="skeleton sk-line" style="width: 50%;"></div>
              <div class="skeleton sk-line short"></div>
            </div>
          </div>
          <div class="skeleton sk-image" style="margin-top: 8px;"></div>
        </div>
      </div>
    </main>

    <!-- Floating Action Button (FAB) -->
    <button class="fab" id="openCreatePostBtn" aria-label="Create Post">
      <i class="fas fa-plus"></i>
    </button>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item active">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </a>
      <a href="community.html" class="nav-item">
        <i class="fas fa-users"></i>
        <span>Community</span>
      </a>
      <a href="chat.html" class="nav-item">
        <i class="fas fa-comment-dots"></i>
        <span>Chat</span>
      </a>
      <a href="resources.html" class="nav-item">
        <i class="fas fa-book-open"></i>
        <span>Resources</span>
      </a>
      <a href="profile.html" class="nav-item">
        <i class="fas fa-user"></i>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <!-- Create Post Modal -->
  <div class="modal-overlay" id="createPostModal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <button class="modal-close" id="closeCreateModalBtn" aria-label="Close">
          <i class="fas fa-times"></i>
        </button>
        <span class="modal-title">Create Post</span>
        <div style="width: 28px;"></div>
      </div>

      <div class="modal-body">
        <!-- Identity Selector -->
        <div class="identity-selector">
          <div class="identity-btn" id="identityToggleBtn">
            <i class="fas fa-user-secret" id="currentIdentityIcon"></i>
            <span id="currentIdentityLabel">Post as Anonymous</span>
            <i class="fas fa-chevron-down"></i>
          </div>
          <div class="identity-dropdown" id="identityDropdown">
            <div class="identity-option" data-anonymous="true">
              <i class="fas fa-user-secret"></i>
              <span>Post as Anonymous</span>
            </div>
            <div class="identity-option" data-anonymous="false" id="namedIdentityOption">
              <i class="fas fa-user"></i>
              <span id="namedIdentityLabel">Post as User</span>
            </div>
          </div>
        </div>

        <!-- Post Textarea -->
        <textarea
          class="post-textarea"
          id="postContentInput"
          placeholder="Share your thoughts..."
          maxlength="2000"
        ></textarea>
        <div class="char-count" id="charCountLabel">0/2000</div>

        <!-- Photo Preview Container -->
        <div class="photo-preview" id="photoPreviewBox" style="display: none;">
          <img id="photoPreviewImg" src="" alt="Photo upload preview" />
          <button class="photo-preview-remove" id="removePhotoBtn" aria-label="Remove Photo">
            <i class="fas fa-times"></i>
          </button>
        </div>

        <!-- Mood Picker (expandable) -->
        <div id="moodPickerContainer" style="display: none; margin-bottom: 12px;">
          <p style="font-size: 13px; font-weight: 600; color: var(--text-mid); margin-bottom: 6px;">How are you feeling?</p>
          <div class="mood-picker" id="moodChipList">
            <button type="button" class="mood-chip" data-mood="like">👍 Feeling good</button>
            <button type="button" class="mood-chip" data-mood="love">❤️ Loved</button>
            <button type="button" class="mood-chip" data-mood="support">🤝 Supported</button>
            <button type="button" class="mood-chip" data-mood="haha">😆 Amused</button>
            <button type="button" class="mood-chip" data-mood="sad">😢 Down</button>
            <button type="button" class="mood-chip" data-mood="angry">😠 Frustrated</button>
          </div>
        </div>

        <!-- Hidden File Input -->
        <input type="file" id="postPhotoFileInput" accept="image/*" style="display: none;" />

        <!-- Toolbar Buttons -->
        <div class="modal-toolbar">
          <button type="button" class="toolbar-btn" id="toolbarPhotoBtn">
            <i class="fa-regular fa-image"></i>
            <span>Add Photo</span>
          </button>
          <button type="button" class="toolbar-btn" id="toolbarMoodBtn">
            <i class="fa-regular fa-face-smile"></i>
            <span id="moodToolbarLabel">Add Mood</span>
          </button>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-post" id="submitPostBtn">Post</button>
      </div>
    </div>
  </div>

  <!-- Comments Drawer Overlay -->
  <div class="comments-overlay" id="commentsDrawer">
    <div class="comments-drawer">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <span class="modal-title">Comments</span>
        <button class="modal-close" id="closeCommentsBtn" aria-label="Close Comments">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="comments-list" id="commentsListContainer">
        <!-- Rendered dynamically -->
      </div>
      <div class="comment-input-row">
        <input
          type="text"
          class="comment-input"
          id="newCommentInput"
          placeholder="Write a kind comment..."
          maxlength="500"
        />
        <button class="comment-send" id="sendCommentBtn" aria-label="Send Comment">
          <i class="fas fa-arrow-up"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
  <script>
    let currentUser = null;
    let currentFeed = [];
    let activeCategory = 'all';
    let postState = {
      isAnonymous: true,
      selectedMood: null,
      photoFile: null,
      photoUrl: null
    };
    let activeCommentPostId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      currentUser = await requireAuth();
      if (!currentUser) return;

      // Update post identity option
      const namedLabel = document.getElementById('namedIdentityLabel');
      if (namedLabel) {
        namedLabel.textContent = `Post as ${currentUser.username || 'me'}`;
      }

      setupCategoryFilter();
      setupCreatePostModal();
      setupCommentsDrawer();
      await loadFeed();
    });

    // Category filter logic
    function setupCategoryFilter() {
      const pills = document.querySelectorAll('#categoryPillRow .pill');
      pills.forEach(pill => {
        pill.addEventListener('click', () => {
          pills.forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          activeCategory = pill.dataset.category || 'all';
          renderFeed();
        });
      });
    }

    // Load feed from DB
    async function loadFeed() {
      try {
        currentFeed = await SafeSpaceDB.posts.getFeed();
        renderFeed();
      } catch (err) {
        console.error('Failed to load feed:', err);
        showToast('Could not load posts', 'error');
      }
    }

    // Render feed
    function renderFeed() {
      const container = document.getElementById('feedContainer');
      let posts = currentFeed || [];

      if (activeCategory !== 'all') {
        posts = posts.filter(p => (p.category || 'general').toLowerCase() === activeCategory.toLowerCase());
      }

      if (posts.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fa-regular fa-newspaper"></i>
            <h3>No posts yet</h3>
            <p>Be the first to share a warm thought with the community!</p>
          </div>
        `;
        return;
      }

      container.innerHTML = posts.map(post => {
        const isAnon = post.is_anonymous;
        const authorDisplay = isAnon ? 'Anonymous' : (post.author_name || 'Member');
        const avatarHtml = isAnon || !post.author_avatar
          ? `<i class="fas ${isAnon ? 'fa-user-secret' : 'fa-user'}"></i>`
          : `<img src="${escapeHTML(post.author_avatar)}" alt="${escapeHTML(authorDisplay)}" />`;

        const moodMeta = post.mood && MOOD_MAP[post.mood] ? MOOD_MAP[post.mood] : null;
        const moodHtml = moodMeta
          ? `<span class="post-mood-tag">· ${moodMeta.emoji} ${moodMeta.label}</span>`
          : '';

        const isLiked = Array.isArray(post.likes) && post.likes.includes(currentUser.id);
        const likeCount = Array.isArray(post.likes) ? post.likes.length : 0;
        const commentCount = Array.isArray(post.comments) ? post.comments.length : 0;
        const isSaved = Array.isArray(post.saved_by) && post.saved_by.includes(currentUser.id);

        return `
          <article class="post-card" id="post-${post.id}">
            <div class="post-header">
              <div class="post-avatar">
                ${avatarHtml}
              </div>
              <div class="post-meta">
                <div class="post-author">${escapeHTML(authorDisplay)}</div>
                <div class="post-time-mood">
                  <span>${formatRelativeTime(post.created_at)}</span>
                  ${moodHtml}
                </div>
              </div>
              <button class="post-menu-btn" onclick="togglePostMenu('${post.id}')" aria-label="Options">
                <i class="fas fa-ellipsis-vertical"></i>
              </button>
            </div>

            <div class="post-content">${escapeHTML(post.content)}</div>

            ${post.photo_url ? `
              <div class="post-image">
                <img src="${escapeHTML(post.photo_url)}" alt="Post attachment" loading="lazy" />
              </div>
            ` : ''}

            <div class="post-actions">
              <button class="post-action-btn ${isLiked ? 'liked' : ''}" onclick="handleLike('${post.id}')">
                <i class="${isLiked ? 'fas' : 'fa-regular'} fa-heart"></i>
                <span id="like-count-${post.id}">${likeCount}</span>
              </button>
              <button class="post-action-btn" onclick="openComments('${post.id}')">
                <i class="fa-regular fa-comment"></i>
                <span>${commentCount}</span>
              </button>
              <button class="post-action-btn ${isSaved ? 'saved' : ''}" onclick="handleSave('${post.id}')">
                <i class="${isSaved ? 'fas' : 'fa-regular'} fa-bookmark"></i>
              </button>
            </div>
          </article>
        `;
      }).join('');
    }

    // Like handler
    async function handleLike(postId) {
      try {
        const result = await SafeSpaceDB.posts.toggleLike(postId);
        const post = currentFeed.find(p => p.id === postId);
        if (post) {
          if (!Array.isArray(post.likes)) post.likes = [];
          if (result.liked) {
            if (!post.likes.includes(currentUser.id)) post.likes.push(currentUser.id);
          } else {
            post.likes = post.likes.filter(id => id !== currentUser.id);
          }
          renderFeed();
        }
      } catch (err) {
        showToast('Failed to update like', 'error');
      }
    }

    // Save handler
    async function handleSave(postId) {
      try {
        const result = await SafeSpaceDB.posts.toggleSave(postId);
        showToast(result.saved ? 'Saved to bookmarks' : 'Removed from bookmarks', 'success');
        const post = currentFeed.find(p => p.id === postId);
        if (post) {
          if (!Array.isArray(post.saved_by)) post.saved_by = [];
          if (result.saved) {
            if (!post.saved_by.includes(currentUser.id)) post.saved_by.push(currentUser.id);
          } else {
            post.saved_by = post.saved_by.filter(id => id !== currentUser.id);
          }
          renderFeed();
        }
      } catch (err) {
        showToast('Failed to bookmark', 'error');
      }
    }

    // Modal & Post creation
    function setupCreatePostModal() {
      const modal = document.getElementById('createPostModal');
      const openBtn = document.getElementById('openCreatePostBtn');
      const closeBtn = document.getElementById('closeCreateModalBtn');
      const identityBtn = document.getElementById('identityToggleBtn');
      const identityDropdown = document.getElementById('identityDropdown');
      const postTextarea = document.getElementById('postContentInput');
      const charCount = document.getElementById('charCountLabel');
      const photoBtn = document.getElementById('toolbarPhotoBtn');
      const photoInput = document.getElementById('postPhotoFileInput');
      const photoPreviewBox = document.getElementById('photoPreviewBox');
      const photoPreviewImg = document.getElementById('photoPreviewImg');
      const removePhotoBtn = document.getElementById('removePhotoBtn');
      const moodBtn = document.getElementById('toolbarMoodBtn');
      const moodContainer = document.getElementById('moodPickerContainer');
      const moodChips = document.querySelectorAll('#moodChipList .mood-chip');
      const submitBtn = document.getElementById('submitPostBtn');

      openBtn.addEventListener('click', () => {
        modal.classList.add('open');
        postTextarea.focus();
      });

      closeBtn.addEventListener('click', () => {
        modal.classList.remove('open');
      });

      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.remove('open');
      });

      // Identity toggle
      identityBtn.addEventListener('click', () => {
        identityDropdown.classList.toggle('open');
      });

      document.querySelectorAll('.identity-option').forEach(opt => {
        opt.addEventListener('click', () => {
          const isAnon = opt.dataset.anonymous === 'true';
          postState.isAnonymous = isAnon;
          document.getElementById('currentIdentityIcon').className = isAnon ? 'fas fa-user-secret' : 'fas fa-user';
          document.getElementById('currentIdentityLabel').textContent = isAnon ? 'Post as Anonymous' : `Post as ${currentUser.username || 'me'}`;
          identityDropdown.classList.remove('open');
        });
      });

      // Char count
      postTextarea.addEventListener('input', () => {
        const len = postTextarea.value.length;
        charCount.textContent = `${len}/2000`;
        charCount.className = 'char-count' + (len >= 2000 ? ' over-limit' : len >= 1800 ? ' near-limit' : '');
      });

      // Photo upload
      photoBtn.addEventListener('click', () => photoInput.click());
      photoInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        postState.photoFile = file;
        const reader = new FileReader();
        reader.onload = (evt) => {
          photoPreviewImg.src = evt.target.result;
          photoPreviewBox.style.display = 'block';
        };
        reader.readAsDataURL(file);
      });

      removePhotoBtn.addEventListener('click', () => {
        postState.photoFile = null;
        postPhotoFileInput.value = '';
        photoPreviewBox.style.display = 'none';
        photoPreviewImg.src = '';
      });

      // Mood picker toggle
      moodBtn.addEventListener('click', () => {
        const isOpen = moodContainer.style.display !== 'none';
        moodContainer.style.display = isOpen ? 'none' : 'block';
      });

      moodChips.forEach(chip => {
        chip.addEventListener('click', () => {
          moodChips.forEach(c => c.classList.remove('selected'));
          if (postState.selectedMood === chip.dataset.mood) {
            postState.selectedMood = null;
            document.getElementById('moodToolbarLabel').textContent = 'Add Mood';
          } else {
            chip.classList.add('selected');
            postState.selectedMood = chip.dataset.mood;
            document.getElementById('moodToolbarLabel').textContent = chip.textContent;
          }
        });
      });

      // Submit post
      submitBtn.addEventListener('click', async () => {
        const content = postTextarea.value.trim();
        if (!content) {
          showToast('Please enter your thoughts before posting', 'warning');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Posting...';

        try {
          let photoUrl = null;
          if (postState.photoFile) {
            photoUrl = await SafeSpaceDB.storage.uploadImage(postState.photoFile, 'post-photos');
          }

          const newPost = await SafeSpaceDB.posts.createPost({
            content,
            mood: postState.selectedMood,
            is_anonymous: postState.isAnonymous,
            photo_url: photoUrl,
            category: activeCategory !== 'all' ? activeCategory : 'general'
          });

          currentFeed.unshift(newPost);
          renderFeed();

          // Reset modal
          postTextarea.value = '';
          charCount.textContent = '0/2000';
          removePhotoBtn.click();
          postState.selectedMood = null;
          document.getElementById('moodToolbarLabel').textContent = 'Add Mood';
          moodChips.forEach(c => c.classList.remove('selected'));
          moodContainer.style.display = 'none';
          modal.classList.remove('open');

          showToast('Shared with the community! 🌈', 'success');
        } catch (err) {
          console.error(err);
          showToast('Failed to share post. Try again.', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Post';
        }
      });
    }

    // Comments drawer
    function setupCommentsDrawer() {
      const drawer = document.getElementById('commentsDrawer');
      const closeBtn = document.getElementById('closeCommentsBtn');
      const sendBtn = document.getElementById('sendCommentBtn');
      const input = document.getElementById('newCommentInput');

      closeBtn.addEventListener('click', () => drawer.classList.remove('open'));
      drawer.addEventListener('click', (e) => {
        if (e.target === drawer) drawer.classList.remove('open');
      });

      sendBtn.addEventListener('click', async () => {
        const content = input.value.trim();
        if (!content || !activeCommentPostId) return;

        try {
          const comment = await SafeSpaceDB.posts.addComment(activeCommentPostId, content);
          input.value = '';
          
          const post = currentFeed.find(p => p.id === activeCommentPostId);
          if (post) {
            if (!Array.isArray(post.comments)) post.comments = [];
            post.comments.push(comment);
            renderComments(post.comments);
            renderFeed();
          }
        } catch (err) {
          showToast('Could not post comment', 'error');
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendBtn.click();
      });
    }

    function openComments(postId) {
      activeCommentPostId = postId;
      const post = currentFeed.find(p => p.id === postId);
      const drawer = document.getElementById('commentsDrawer');
      renderComments(post ? (post.comments || []) : []);
      drawer.classList.add('open');
    }

    function renderComments(comments) {
      const container = document.getElementById('commentsListContainer');
      if (comments.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding: 32px 16px; color: var(--text-muted); font-size: 14px;">
            No comments yet. Leave a kind word!
          </div>
        `;
        return;
      }

      container.innerHTML = comments.map(c => `
        <div class="comment-item">
          <div class="comment-avatar">
            <i class="fas fa-user"></i>
          </div>
          <div class="comment-body">
            <div class="comment-author">${escapeHTML(c.username || 'Member')}</div>
            <div class="comment-text">${escapeHTML(c.content)}</div>
            <div class="comment-time">${formatRelativeTime(c.created_at)}</div>
          </div>
        </div>
      `).join('');
    }

    function togglePostMenu(postId) {
      showToast('Options for this post', 'info');
    }
  </script>
</body>
</html>
