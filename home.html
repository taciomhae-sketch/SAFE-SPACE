<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Home — Safe Space</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#6C4FD1" />
  <link rel="icon" type="image/png" href="assets/icons/favicon.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
</head>
<body>
  <div class="app-frame">
    <!-- Page Loading Overlay -->
    <div class="page-loader" id="pageLoader">
      <div class="loader-content">
        <div class="loader-spinner-ring">
          <div class="loader-icon-center">
            <img class="loader-logo-img" src="assets/icons/SAFE_SPACE_LOGO.png" alt="Safe Space" />
          </div>
        </div>
        <div class="loader-label">Safe Space</div>
        <div class="loader-sublabel">Loading feed...</div>
      </div>
    </div>

    <!-- Page Header -->
    <header class="page-header">
      <h1>Home</h1>
      <div class="header-actions">
        <button class="header-select-btn" id="selectBtn">Select</button>
        <button class="header-btn" id="notificationsBtn" aria-label="Notifications">
          <i class="fa-regular fa-bell"></i>
        </button>
      </div>
    </header>

    <!-- Category Pill Row -->
    <div class="pill-scroll-wrap">
      <div class="pill-row" id="categoryPillRow">
        <button class="pill active" data-category="all">All</button>
        <button class="pill" data-category="general">General</button>
        <button class="pill" data-category="support">Support</button>
        <button class="pill" data-category="story">Story</button>
      </div>
    </div>

    <!-- Scrollable Feed Content -->
    <main class="page-content" id="pageContent">
      <div class="feed-list" id="feedContainer">
        <!-- Skeleton Loading -->
        <div class="skeleton-post">
          <div class="sk-header">
            <div class="skeleton sk-avatar"></div>
            <div class="sk-lines">
              <div class="skeleton sk-line" style="width: 40%;"></div>
              <div class="skeleton sk-line short"></div>
            </div>
          </div>
          <div class="skeleton sk-line" style="margin-bottom: 8px;"></div>
          <div class="skeleton sk-line" style="width: 80%;"></div>
        </div>
        <div class="skeleton-post">
          <div class="sk-header">
            <div class="skeleton sk-avatar"></div>
            <div class="sk-lines">
              <div class="skeleton sk-line" style="width: 50%;"></div>
              <div class="skeleton sk-line short"></div>
            </div>
          </div>
          <div class="skeleton sk-image" style="margin-top: 8px;"></div>
        </div>
      </div>
    </main>

    <!-- Floating Action Button (FAB) -->
    <button class="fab" id="openCreatePostBtn" aria-label="Create Post">
      <i class="fas fa-plus"></i>
    </button>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="home.html" class="nav-item active">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </a>
      <a href="community.html" class="nav-item">
        <i class="fas fa-users"></i>
        <span>Community</span>
      </a>
      <a href="chat.html" class="nav-item">
        <i class="fas fa-comment-dots"></i>
        <span>Chat</span>
      </a>
      <a href="resources.html" class="nav-item">
        <i class="fas fa-book-open"></i>
        <span>Resources</span>
      </a>
      <a href="profile.html" class="nav-item">
        <i class="fas fa-user"></i>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <!-- Create Post Modal -->
  <div class="modal-overlay" id="createPostModal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <button class="modal-close" id="closeCreateModalBtn" aria-label="Close">
          <i class="fas fa-times"></i>
        </button>
        <span class="modal-title">Create Post</span>
        <div style="width: 28px;"></div>
      </div>

      <div class="modal-body">
        <!-- Category Picker — Required, visible first -->
        <div style="margin-bottom: 14px;">
          <p style="font-size: 12px; font-weight: 700; color: var(--text-mid); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; display:flex; align-items:center; gap:4px;">
            <i class="fas fa-tag" style="color: var(--primary); font-size:11px;"></i>
            Post Category <span style="color: var(--primary);">*</span>
          </p>
          <div class="category-chips" id="postCategoryChips" style="display:flex; gap: 8px;">
            <button type="button" class="category-chip selected" data-category="general" style="flex:1;">
              <i class="fa-regular fa-comment-dots" style="margin-right:4px;"></i>General
            </button>
            <button type="button" class="category-chip" data-category="support" style="flex:1;">
              <i class="fa-regular fa-hand-holding-heart" style="margin-right:4px;"></i>Support
            </button>
            <button type="button" class="category-chip" data-category="story" style="flex:1;">
              <i class="fa-regular fa-book-open" style="margin-right:4px;"></i>Story
            </button>
          </div>
        </div>

        <!-- Identity Selector -->
        <div class="identity-selector">
          <div class="identity-btn" id="identityToggleBtn">
            <i class="fas fa-user-secret" id="currentIdentityIcon"></i>
            <span id="currentIdentityLabel">Post as Anonymous</span>
            <i class="fas fa-chevron-down"></i>
          </div>
          <div class="identity-dropdown" id="identityDropdown">
            <div class="identity-option" data-anonymous="true">
              <i class="fas fa-user-secret"></i>
              <span>Post as Anonymous</span>
            </div>
            <div class="identity-option" data-anonymous="false" id="namedIdentityOption">
              <i class="fas fa-user"></i>
              <span id="namedIdentityLabel">Post as User</span>
            </div>
          </div>
        </div>

        <!-- Post Textarea -->
        <textarea
          class="post-textarea"
          id="postContentInput"
          placeholder="Share your thoughts..."
          maxlength="2000"
        ></textarea>
        <div class="char-count" id="charCountLabel">0/2000</div>

        <!-- Photo Preview Container -->
        <div class="photo-preview" id="photoPreviewBox" style="display: none; position: relative;">
          <img id="photoPreviewImg" src="" alt="Photo upload preview" />
          <div id="photoCategoryBadge" style="position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.7); color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">
            Uploading to: General
          </div>
          <button class="photo-preview-remove" id="removePhotoBtn" aria-label="Remove Photo">
            <i class="fas fa-times"></i>
          </button>
        </div>

        <!-- Mood Picker (expandable) -->
        <div id="moodPickerContainer" style="display: none; margin-bottom: 12px;">
          <p style="font-size: 13px; font-weight: 600; color: var(--text-mid); margin-bottom: 6px;">How are you feeling?</p>
          <div class="mood-picker" id="moodChipList">
            <button type="button" class="mood-chip" data-mood="like">👍 Feeling good</button>
            <button type="button" class="mood-chip" data-mood="love">❤️ Loved</button>
            <button type="button" class="mood-chip" data-mood="support">🤝 Supported</button>
            <button type="button" class="mood-chip" data-mood="haha">😆 Amused</button>
            <button type="button" class="mood-chip" data-mood="sad">😢 Down</button>
            <button type="button" class="mood-chip" data-mood="angry">😠 Frustrated</button>
          </div>
        </div>

        <!-- Hidden File Input -->
        <input type="file" id="postPhotoFileInput" accept="image/*" style="display: none;" />

        <!-- Toolbar Buttons -->
        <div class="modal-toolbar">
          <button type="button" class="toolbar-btn" id="toolbarPhotoBtn">
            <i class="fa-regular fa-image"></i>
            <span>Add Photo</span>
          </button>
          <button type="button" class="toolbar-btn" id="toolbarMoodBtn">
            <i class="fa-regular fa-face-smile"></i>
            <span id="moodToolbarLabel">Add Mood</span>
          </button>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-post" id="submitPostBtn">Post</button>
      </div>
    </div>
  </div>

  <!-- Comments Drawer Overlay -->
  <div class="comments-overlay" id="commentsDrawer">
    <div class="comments-drawer">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <span class="modal-title" id="commentsDrawerTitle">Comments</span>
        <button class="modal-close" id="closeCommentsBtn" aria-label="Close Comments">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="comments-list" id="commentsListContainer">
        <!-- Rendered dynamically -->
      </div>

      <!-- Replying Banner -->
      <div class="replying-banner" id="replyingBanner" style="display: none;">
        <div class="replying-info">
          <i class="fas fa-reply" style="font-size:11px;"></i>
          <span>Replying to <strong id="replyingTargetUser">@user</strong></span>
        </div>
        <button type="button" class="replying-cancel" id="cancelReplyBtn" aria-label="Cancel Reply">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="comment-input-row">
        <input
          type="text"
          class="comment-input"
          id="newCommentInput"
          placeholder="Write a kind comment..."
          maxlength="500"
        />
        <button class="comment-send" id="sendCommentBtn" aria-label="Send Comment">
          <i class="fas fa-arrow-up"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Post Options Modal Sheet -->
  <div class="modal-overlay" id="postOptionsMenu">
    <div class="post-menu-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header" style="border:none; padding-bottom: 8px;">
        <span class="modal-title">Post Options</span>
        <button class="modal-close" id="closePostOptionsBtn" aria-label="Close">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="post-menu-list">
        <button class="post-menu-item" id="menuCopyTextBtn">
          <i class="fa-regular fa-copy"></i>
          <span>Copy Post Text</span>
        </button>
        <button class="post-menu-item" id="menuShareBtn">
          <i class="fa-regular fa-share-from-square"></i>
          <span>Share Post</span>
        </button>
        <button class="post-menu-item" id="menuReportBtn">
          <i class="fa-regular fa-flag"></i>
          <span>Report Post</span>
        </button>
        <button class="post-menu-item danger" id="menuDeleteBtn" style="display: none;">
          <i class="fa-regular fa-trash-can"></i>
          <span>Delete Post</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/lib/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
  <script>
    let currentUser = null;
    let currentFeed = [];
    let activeCategory = 'all';
    let postState = {
      isAnonymous: true,
      selectedMood: null,
      selectedCategory: 'general',
      photoFile: null,
      photoUrl: null
    };
    let activeCommentPostId = null;
    let activeMenuPostId = null;

    // Helper to format user display name: guarantees email is NEVER shown
    function formatDisplayName(name, fallback) {
      if (!name) return fallback || 'Member';
      let clean = String(name).trim();
      if (clean.includes('@')) {
        clean = clean.split('@')[0];
      }
      return clean || fallback || 'Member';
    }

    document.addEventListener('DOMContentLoaded', async () => {
      currentUser = await requireAuth();
      if (!currentUser) return;

      // Update post identity option
      const namedLabel = document.getElementById('namedIdentityLabel');
      if (namedLabel) {
        namedLabel.textContent = `Post as ${formatDisplayName(currentUser.username || currentUser.first_name, 'me')}`;
      }

      setupCategoryFilter();
      setupCreatePostModal();
      setupCommentsDrawer();
      setupPostOptionsMenu();
      await loadFeed();
      hidePageLoader();
    });

    // Category filter logic (Feed tabs)
    function setupCategoryFilter() {
      const pills = document.querySelectorAll('#categoryPillRow .pill');
      pills.forEach(pill => {
        pill.addEventListener('click', () => {
          pills.forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          activeCategory = pill.dataset.category || 'all';
          renderFeed();
        });
      });
    }

    // Load feed from DB
    async function loadFeed() {
      try {
        currentFeed = await SafeSpaceDB.posts.getFeed();
        renderFeed();
      } catch (err) {
        console.error('Failed to load feed:', err);
        showToast('Could not load posts', 'error');
      }
    }

    // Render feed
    function renderFeed() {
      const container = document.getElementById('feedContainer');
      let posts = currentFeed || [];

      if (activeCategory !== 'all') {
        const target = activeCategory.toLowerCase();
        posts = posts.filter(p => {
          const c = (p.category || 'general').toLowerCase();
          if (target === 'story' || target === 'stories') {
            return c === 'story' || c === 'stories';
          }
          return c === target;
        });
      }

      if (posts.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fa-regular fa-newspaper"></i>
            <h3>No posts yet</h3>
            <p>Be the first to share a warm thought with the community!</p>
          </div>
        `;
        return;
      }

      container.innerHTML = posts.map(post => {
        const isAnon = post.is_anonymous;
        const authorDisplay = isAnon ? 'Anonymous' : formatDisplayName(post.author_name, 'Member');
        const avatarHtml = isAnon || !post.author_avatar
          ? `<i class="fas ${isAnon ? 'fa-user-secret' : 'fa-user'}"></i>`
          : `<img src="${escapeHTML(post.author_avatar)}" alt="${escapeHTML(authorDisplay)}" />`;

        const moodMeta = post.mood && MOOD_MAP[post.mood] ? MOOD_MAP[post.mood] : null;
        const moodHtml = moodMeta
          ? `<span class="post-mood-tag">· ${moodMeta.emoji} ${moodMeta.label}</span>`
          : '';

        const rawCat = (post.category || 'general').toLowerCase();
        const catLabel = (rawCat === 'story' || rawCat === 'stories') ? 'STORY' : rawCat.toUpperCase();
        const catClass = (rawCat === 'story' || rawCat === 'stories') ? 'story' : rawCat;
        const isLiked = Array.isArray(post.likes) && post.likes.includes(currentUser.id);
        const likeCount = Array.isArray(post.likes) ? post.likes.length : 0;
        const commentCount = Array.isArray(post.comments) ? post.comments.length : 0;
        const isSaved = Array.isArray(post.saved_by) && post.saved_by.includes(currentUser.id);

        return `
          <article class="post-card" id="post-${post.id}">
            <div class="post-header">
              <div class="post-avatar">
                ${avatarHtml}
              </div>
              <div class="post-meta">
                <div class="post-author">${escapeHTML(authorDisplay)}</div>
                <div class="post-time-mood">
                  <span>${formatRelativeTime(post.created_at)}</span>
                  <span class="post-category-tag ${escapeHTML(catClass)}">${escapeHTML(catLabel)}</span>
                  ${moodHtml}
                </div>
              </div>
              <button class="post-menu-btn" onclick="togglePostMenu('${post.id}')" aria-label="Options">
                <i class="fas fa-ellipsis-vertical"></i>
              </button>
            </div>

            <div class="post-content">${escapeHTML(post.content)}</div>

            ${post.photo_url ? `
              <div class="post-image">
                <img src="${escapeHTML(post.photo_url)}" alt="Post attachment" loading="lazy" />
              </div>
            ` : ''}

            <div class="post-actions">
              <button class="post-action-btn ${isLiked ? 'liked' : ''}" onclick="handleLike('${post.id}')" aria-label="Like post">
                <i class="${isLiked ? 'fas' : 'fa-regular'} fa-heart"></i>
                <span id="like-count-${post.id}">${likeCount}</span>
              </button>
              <button class="post-action-btn" onclick="openComments('${post.id}')" aria-label="Comments">
                <i class="fa-regular fa-comment"></i>
                <span id="comment-count-${post.id}">${commentCount}</span>
              </button>
              <button class="post-action-btn ${isSaved ? 'saved' : ''}" onclick="handleSave('${post.id}')" aria-label="Bookmark post">
                <i class="${isSaved ? 'fas' : 'fa-regular'} fa-bookmark"></i>
              </button>
            </div>
          </article>
        `;
      }).join('');
    }

    // Like handler
    async function handleLike(postId) {
      try {
        const result = await SafeSpaceDB.posts.toggleLike(postId);
        const post = currentFeed.find(p => p.id === postId);
        if (post) {
          if (!Array.isArray(post.likes)) post.likes = [];
          if (result.liked) {
            if (!post.likes.includes(currentUser.id)) post.likes.push(currentUser.id);
          } else {
            post.likes = post.likes.filter(id => id !== currentUser.id);
          }
        }

        const postCard = document.getElementById(`post-${postId}`);
        if (postCard) {
          const btn = postCard.querySelector('.post-action-btn:nth-child(1)');
          const icon = btn ? btn.querySelector('i') : null;
          const countSpan = document.getElementById(`like-count-${postId}`);
          if (result.liked) {
            if (btn) btn.classList.add('liked');
            if (icon) icon.className = 'fas fa-heart';
          } else {
            if (btn) btn.classList.remove('liked');
            if (icon) icon.className = 'fa-regular fa-heart';
          }
          if (countSpan) {
            countSpan.textContent = result.count !== undefined ? result.count : (post ? post.likes.length : 0);
          }
        }
      } catch (err) {
        showToast('Failed to update like', 'error');
      }
    }

    // Save handler
    async function handleSave(postId) {
      try {
        const result = await SafeSpaceDB.posts.toggleSave(postId);
        showToast(result.saved ? 'Saved to bookmarks' : 'Removed from bookmarks', 'success');
        const post = currentFeed.find(p => p.id === postId);
        if (post) {
          if (!Array.isArray(post.saved_by)) post.saved_by = [];
          if (result.saved) {
            if (!post.saved_by.includes(currentUser.id)) post.saved_by.push(currentUser.id);
          } else {
            post.saved_by = post.saved_by.filter(id => id !== currentUser.id);
          }
        }

        const postCard = document.getElementById(`post-${postId}`);
        if (postCard) {
          const btn = postCard.querySelector('.post-action-btn:nth-child(3)');
          const icon = btn ? btn.querySelector('i') : null;
          if (result.saved) {
            if (btn) btn.classList.add('saved');
            if (icon) icon.className = 'fas fa-bookmark';
          } else {
            if (btn) btn.classList.remove('saved');
            if (icon) icon.className = 'fa-regular fa-bookmark';
          }
        }
      } catch (err) {
        showToast('Failed to bookmark', 'error');
      }
    }

    // Modal & Post creation
    function setupCreatePostModal() {
      const modal = document.getElementById('createPostModal');
      const openBtn = document.getElementById('openCreatePostBtn');
      const closeBtn = document.getElementById('closeCreateModalBtn');
      const identityBtn = document.getElementById('identityToggleBtn');
      const identityDropdown = document.getElementById('identityDropdown');
      const postTextarea = document.getElementById('postContentInput');
      const charCount = document.getElementById('charCountLabel');
      const photoBtn = document.getElementById('toolbarPhotoBtn');
      const photoInput = document.getElementById('postPhotoFileInput');
      const photoPreviewBox = document.getElementById('photoPreviewBox');
      const photoPreviewImg = document.getElementById('photoPreviewImg');
      const removePhotoBtn = document.getElementById('removePhotoBtn');
      const moodBtn = document.getElementById('toolbarMoodBtn');
      const moodContainer = document.getElementById('moodPickerContainer');
      const moodChips = document.querySelectorAll('#moodChipList .mood-chip');
      const catChips = document.querySelectorAll('#postCategoryChips .category-chip');
      const submitBtn = document.getElementById('submitPostBtn');

      openBtn.addEventListener('click', () => {
        modal.classList.add('open');
        postTextarea.focus();
      });

      closeBtn.addEventListener('click', () => {
        modal.classList.remove('open');
      });

      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.remove('open');
      });

      // Identity toggle
      identityBtn.addEventListener('click', () => {
        identityDropdown.classList.toggle('open');
      });

      document.querySelectorAll('.identity-option').forEach(opt => {
        opt.addEventListener('click', () => {
          const isAnon = opt.dataset.anonymous === 'true';
          postState.isAnonymous = isAnon;
          document.getElementById('currentIdentityIcon').className = isAnon ? 'fas fa-user-secret' : 'fas fa-user';
          document.getElementById('currentIdentityLabel').textContent = isAnon ? 'Post as Anonymous' : `Post as ${formatDisplayName(currentUser.username || currentUser.first_name, 'me')}`;
          identityDropdown.classList.remove('open');
        });
      });

      // Category chip selection in modal
      catChips.forEach(chip => {
        chip.addEventListener('click', () => {
          catChips.forEach(c => c.classList.remove('selected'));
          chip.classList.add('selected');
          postState.selectedCategory = chip.dataset.category || 'general';
          const badge = document.getElementById('photoCategoryBadge');
          if (badge) {
            badge.textContent = `Uploading to: ${chip.textContent.trim()}`;
          }
        });
      });

      // Char count
      postTextarea.addEventListener('input', () => {
        const len = postTextarea.value.length;
        charCount.textContent = `${len}/2000`;
        charCount.className = 'char-count' + (len >= 2000 ? ' over-limit' : len >= 1800 ? ' near-limit' : '');
      });

      // Photo upload
      photoBtn.addEventListener('click', () => photoInput.click());
      photoInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        postState.photoFile = file;
        const reader = new FileReader();
        reader.onload = (evt) => {
          photoPreviewImg.src = evt.target.result;
          photoPreviewBox.style.display = 'block';
        };
        reader.readAsDataURL(file);
      });

      removePhotoBtn.addEventListener('click', () => {
        postState.photoFile = null;
        photoInput.value = '';
        photoPreviewBox.style.display = 'none';
        photoPreviewImg.src = '';
      });

      // Mood picker toggle
      moodBtn.addEventListener('click', () => {
        const isOpen = moodContainer.style.display !== 'none';
        moodContainer.style.display = isOpen ? 'none' : 'block';
      });

      moodChips.forEach(chip => {
        chip.addEventListener('click', () => {
          moodChips.forEach(c => c.classList.remove('selected'));
          if (postState.selectedMood === chip.dataset.mood) {
            postState.selectedMood = null;
            document.getElementById('moodToolbarLabel').textContent = 'Add Mood';
          } else {
            chip.classList.add('selected');
            postState.selectedMood = chip.dataset.mood;
            document.getElementById('moodToolbarLabel').textContent = chip.textContent;
          }
        });
      });

      // Submit post
      submitBtn.addEventListener('click', async () => {
        const content = postTextarea.value.trim();
        if (!content) {
          showToast('Please enter your thoughts before posting', 'warning');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Posting...';

        try {
          let photoUrl = null;
          if (postState.photoFile) {
            photoUrl = await SafeSpaceDB.storage.uploadImage(postState.photoFile, 'post-photos');
          }

          const newPost = await SafeSpaceDB.posts.createPost({
            content,
            mood: postState.selectedMood,
            is_anonymous: postState.isAnonymous,
            photo_url: photoUrl,
            category: postState.selectedCategory || 'general'
          });

          currentFeed.unshift(newPost);
          renderFeed();

          // Reset modal
          postTextarea.value = '';
          charCount.textContent = '0/2000';
          removePhotoBtn.click();
          postState.selectedMood = null;
          postState.selectedCategory = 'general';
          catChips.forEach(c => {
            if (c.dataset.category === 'general') c.classList.add('selected');
            else c.classList.remove('selected');
          });
          const badge = document.getElementById('photoCategoryBadge');
          if (badge) badge.textContent = 'Uploading to: General';
          document.getElementById('moodToolbarLabel').textContent = 'Add Mood';
          moodChips.forEach(c => c.classList.remove('selected'));
          moodContainer.style.display = 'none';
          modal.classList.remove('open');

          showToast('Shared with the community! 🌈', 'success');
        } catch (err) {
          console.error(err);
          showToast('Failed to share post. Try again.', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Post';
        }
      });
    }

    // Comments drawer with Reactions and Replies
    let activeReplyTarget = null; // { commentId: string, username: string }

    function clearReplyTarget() {
      activeReplyTarget = null;
      const banner = document.getElementById('replyingBanner');
      if (banner) banner.style.display = 'none';
      const input = document.getElementById('newCommentInput');
      if (input) input.placeholder = 'Write a kind comment...';
    }

    function startReplyToComment(commentId, authorUsername) {
      activeReplyTarget = { commentId, username: authorUsername };
      const banner = document.getElementById('replyingBanner');
      const userLabel = document.getElementById('replyingTargetUser');
      const input = document.getElementById('newCommentInput');
      if (banner && userLabel) {
        userLabel.textContent = '@' + authorUsername;
        banner.style.display = 'flex';
      }
      if (input) {
        input.placeholder = `Replying to @${authorUsername}...`;
        input.focus();
      }
    }
    window.startReplyToComment = startReplyToComment;

    const _isUUIDComment = id => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);

    async function handleCommentReaction(commentId) {
      if (!currentUser) return;
      try {
        let res;

        if (_isUUIDComment(commentId)) {
          // Real Supabase comment — persist reaction to DB
          res = await SafeSpaceDB.posts.toggleCommentReaction(commentId, activeCommentPostId);
          // Also sync currentFeed state
          const post = currentFeed.find(p => p.id === activeCommentPostId);
          if (post && Array.isArray(post.comments)) {
            const c = post.comments.find(item => item.id === commentId);
            if (c) {
              if (!Array.isArray(c.likes)) c.likes = [];
              if (res.reacted) {
                if (!c.likes.includes(currentUser.id)) c.likes.push(currentUser.id);
              } else {
                c.likes = c.likes.filter(id => id !== currentUser.id);
              }
            }
          }
        } else {
          // Local/demo comment (non-UUID) — handle purely in currentFeed memory
          const post = currentFeed.find(p => p.id === activeCommentPostId);
          let reacted = false, count = 0;
          if (post && Array.isArray(post.comments)) {
            const c = post.comments.find(item => item.id === commentId);
            if (c) {
              if (!Array.isArray(c.likes)) c.likes = [];
              const idx = c.likes.indexOf(currentUser.id);
              if (idx > -1) {
                c.likes.splice(idx, 1);
                reacted = false;
              } else {
                c.likes.push(currentUser.id);
                reacted = true;
              }
              count = c.likes.length;
            }
          }
          res = { reacted, count };
        }

        // Surgical DOM update — works for both UUID and demo comments
        const btn = document.getElementById(`comment-react-btn-${commentId}`);
        if (btn) {
          const icon = btn.querySelector('i');
          const countSpan = btn.querySelector('.comment-react-count');
          if (res.reacted) {
            btn.classList.add('reacted');
            if (icon) icon.className = 'fas fa-heart';
          } else {
            btn.classList.remove('reacted');
            if (icon) icon.className = 'fa-regular fa-heart';
          }
          if (countSpan) countSpan.textContent = res.count > 0 ? res.count : '';
        }
      } catch (err) {
        console.error('Comment reaction failed:', err);
      }
    }
    window.handleCommentReaction = handleCommentReaction;

    function setupCommentsDrawer() {
      const drawer = document.getElementById('commentsDrawer');
      const closeBtn = document.getElementById('closeCommentsBtn');
      const sendBtn = document.getElementById('sendCommentBtn');
      const input = document.getElementById('newCommentInput');
      const cancelReplyBtn = document.getElementById('cancelReplyBtn');

      if (cancelReplyBtn) {
        cancelReplyBtn.addEventListener('click', clearReplyTarget);
      }

      closeBtn.addEventListener('click', () => {
        clearReplyTarget();
        drawer.classList.remove('open');
      });

      drawer.addEventListener('click', (e) => {
        if (e.target === drawer) {
          clearReplyTarget();
          drawer.classList.remove('open');
        }
      });

      sendBtn.addEventListener('click', async () => {
        const content = input.value.trim();
        if (!content || !activeCommentPostId) return;

        sendBtn.disabled = true;
        try {
          const replyOpts = activeReplyTarget ? {
            parent_id: activeReplyTarget.commentId,
            reply_to: activeReplyTarget.username
          } : {};

          const comment = await SafeSpaceDB.posts.addComment(activeCommentPostId, content, replyOpts);
          input.value = '';
          clearReplyTarget();
          
          const post = currentFeed.find(p => p.id === activeCommentPostId);
          if (post) {
            if (!Array.isArray(post.comments)) post.comments = [];
            post.comments.push(comment);
            renderComments(post.comments);
            
            const countSpan = document.getElementById(`comment-count-${activeCommentPostId}`);
            if (countSpan) countSpan.textContent = post.comments.length;
          }
          showToast('Comment posted! 💬', 'success');
        } catch (err) {
          showToast('Could not post comment', 'error');
        } finally {
          sendBtn.disabled = false;
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendBtn.click();
      });
    }

    function openComments(postId) {
      activeCommentPostId = postId;
      clearReplyTarget();
      const post = currentFeed.find(p => p.id === postId);
      const drawer = document.getElementById('commentsDrawer');
      const comments = post ? (post.comments || []) : [];
      
      const title = document.getElementById('commentsDrawerTitle');
      if (title) title.textContent = `Comments (${comments.length})`;

      renderComments(comments);
      drawer.classList.add('open');
    }

    function renderComments(comments) {
      const container = document.getElementById('commentsListContainer');
      const title = document.getElementById('commentsDrawerTitle');
      if (title) title.textContent = `Comments (${comments.length})`;

      if (comments.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding: 32px 16px; color: var(--text-muted); font-size: 14px;">
            No comments yet. Leave a kind word!
          </div>
        `;
        return;
      }

      container.innerHTML = comments.map(c => {
        const username = formatDisplayName(c.username, 'Member');
        const avatarHtml = c.avatar_url
          ? `<img src="${escapeHTML(c.avatar_url)}" alt="${escapeHTML(username)}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;" />`
          : `<i class="fas fa-user"></i>`;
        
        const isReacted = Array.isArray(c.likes) && currentUser && c.likes.includes(currentUser.id);
        const reactCount = Array.isArray(c.likes) ? c.likes.length : 0;
        const isReply = Boolean(c.parent_id || c.reply_to);
        const replyBadge = c.reply_to ? `<span class="comment-reply-indicator"><i class="fas fa-reply" style="font-size:10px;"></i> @${escapeHTML(c.reply_to)}</span>` : '';

        return `
        <div class="comment-item ${isReply ? 'is-reply' : ''}" id="comment-${c.id}">
          <div class="comment-avatar">
            ${avatarHtml}
          </div>
          <div class="comment-body">
            <div class="comment-author">${escapeHTML(username)}</div>
            <div class="comment-text">${replyBadge}${escapeHTML(c.content)}</div>
            <div class="comment-actions-row">
              <span class="comment-time">${formatRelativeTime(c.created_at)}</span>
              <button type="button" class="comment-action-btn ${isReacted ? 'reacted' : ''}" id="comment-react-btn-${c.id}" onclick="handleCommentReaction('${c.id}')" aria-label="React to comment">
                <i class="${isReacted ? 'fas' : 'fa-regular'} fa-heart"></i>
                <span class="comment-react-count">${reactCount > 0 ? reactCount : ''}</span>
              </button>
              <button type="button" class="comment-action-btn" onclick="startReplyToComment('${c.id}', '${escapeHTML(username)}')" aria-label="Reply to comment">
                <i class="fa-regular fa-message"></i>
                <span>Reply</span>
              </button>
            </div>
          </div>
        </div>
      `;
      }).join('');
    }

    // Post Options Menu Sheet
    function setupPostOptionsMenu() {
      const modal = document.getElementById('postOptionsMenu');
      const closeBtn = document.getElementById('closePostOptionsBtn');
      const copyBtn = document.getElementById('menuCopyTextBtn');
      const shareBtn = document.getElementById('menuShareBtn');
      const reportBtn = document.getElementById('menuReportBtn');
      const deleteBtn = document.getElementById('menuDeleteBtn');

      closeBtn.addEventListener('click', () => modal.classList.remove('open'));
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.remove('open');
      });

      copyBtn.addEventListener('click', async () => {
        const post = currentFeed.find(p => p.id === activeMenuPostId);
        if (post && post.content) {
          try {
            await navigator.clipboard.writeText(post.content);
            showToast('Post text copied to clipboard 📋', 'success');
          } catch (e) {
            showToast('Unable to copy to clipboard', 'warning');
          }
        }
        modal.classList.remove('open');
      });

      shareBtn.addEventListener('click', () => {
        if (navigator.share) {
          navigator.share({
            title: 'Safe Space Post',
            text: 'Check out this post on Safe Space!',
            url: window.location.href
          }).catch(() => {});
        } else {
          showToast('Link ready to share! 🔗', 'info');
        }
        modal.classList.remove('open');
      });

      reportBtn.addEventListener('click', () => {
        modal.classList.remove('open');
        showToast('Thank you. Post flagged for moderation review 🛡️', 'info');
      });

      deleteBtn.addEventListener('click', async () => {
        if (!activeMenuPostId) return;
        if (!confirm('Are you sure you want to delete this post?')) return;

        modal.classList.remove('open');
        try {
          await SafeSpaceDB.posts.deletePost(activeMenuPostId);
          currentFeed = currentFeed.filter(p => p.id !== activeMenuPostId);
          renderFeed();
          showToast('Post deleted', 'info');
        } catch (err) {
          showToast('Failed to delete post', 'error');
        }
      });
    }

    function togglePostMenu(postId) {
      activeMenuPostId = postId;
      const post = currentFeed.find(p => p.id === postId);
      if (!post) return;

      const modal = document.getElementById('postOptionsMenu');
      const deleteBtn = document.getElementById('menuDeleteBtn');

      if (currentUser && post.user_id === currentUser.id) {
        deleteBtn.style.display = 'flex';
      } else {
        deleteBtn.style.display = 'none';
      }

      modal.classList.add('open');
    }
  </script>
</body>
</html>
